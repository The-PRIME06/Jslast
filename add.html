<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
     <header class="container">
        <nav>
            <img class="logo" src="https://thumbs.dreamstime.com/b/scenic-limassol-seafront-modern-skyscrapers-background-typical-sunny-day-cyprus-469976939.jpg" alt="Logo">
            <a href="./index.html">Back</a>
        </nav>

    </header>
    <main>
        <section>
            <div class="container">
               <div class="add-box">
                <h2 id="form-title">Create a new one</h2>
                 <form class="add-label" id="add-form">
                   <input type="url" name="image" placeholder="Add your image" required>
                   <input type="text" name="name" placeholder="Name" required>
                   <input type="text" name="username" placeholder="Username" required>
                   <input type="email" name="email" placeholder="Email" required>
                   <input type="text" name="address" placeholder="Address" required>
                   <button type="submit" id="submit-btn" class="add-btn">Add</button>
                 </form>
</div>
            </div>

        </section>
    </main>

    <script src="./script.js"></script>
    
</body>
</html>
